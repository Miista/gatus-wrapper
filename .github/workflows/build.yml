name: Build and publish

on:
  push:
    branches:
      - fix/use-fork-image
  schedule:
    - cron: '0 2 * * *'  # daily at 2 AM UTC
  workflow_dispatch:       # manual trigger for testing / bootstrapping

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.check.outputs.needs_build }}
      digest: ${{ steps.check.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for new upstream image
        id: check
        run: |
          LATEST=$(curl -sf \
            "https://ghcr.io/v2/miista/gatus/manifests/latest" \
            -H "Authorization: Bearer $(echo "" | base64)" \
            --head -o /dev/null -w "%header{docker-content-digest}" 2>/dev/null || \
            docker manifest inspect ghcr.io/miista/gatus:latest 2>/dev/null | \
            jq -r '.config.digest // .manifests[0].digest')

          CURRENT=$(cat .digest 2>/dev/null || echo "")

          echo "Latest: $LATEST  Current: $CURRENT"
          echo "digest=$LATEST" >> $GITHUB_OUTPUT

          if [ "$LATEST" != "$CURRENT" ] || [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "needs_build=true" >> $GITHUB_OUTPUT
          else
            echo "needs_build=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: detect
    if: needs.detect.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: GATUS_VERSION=latest

      - name: Update .digest and commit
        if: github.event_name != 'push'
        run: |
          echo "${{ needs.detect.outputs.digest }}" > .digest
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .digest
          git commit -m "chore: update to ${{ needs.detect.outputs.digest }}" || true
          git push
